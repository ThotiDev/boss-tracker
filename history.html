<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Historial — Boss Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#07070d;--bg2:#0d0d18;--surface:#10101e;--surface2:#161626;--surface3:#1c1c30;
  --gold:#c8a84b;--gold2:#e8c96a;--gold-dim:rgba(200,168,75,0.12);--gold-glow:rgba(200,168,75,0.25);
  --green:#3ddc84;--green-dim:rgba(61,220,132,0.12);
  --yellow:#fbbf24;--yellow-dim:rgba(251,191,36,0.12);
  --red:#f87171;--red-dim:rgba(248,113,113,0.12);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,0.12);
  --purple:#a78bfa;
  --text:#f0ebe0;--text2:#9d9080;--text3:#5a5248;
  --border:rgba(200,168,75,0.15);--border2:rgba(200,168,75,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);min-height:100vh;font-family:'Crimson Pro',serif;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(200,168,75,0.06) 0%,transparent 70%);pointer-events:none;z-index:0;}

/* HEADER */
.header{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:24px 40px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(10,10,20,0.9) 0%,transparent 100%);backdrop-filter:blur(4px);}
.header-left{display:flex;align-items:center;gap:16px;}
.back-btn{background:var(--gold-dim);border:1px solid var(--border);color:var(--gold2);padding:9px 16px;border-radius:8px;font-family:'Cinzel',serif;font-size:12px;cursor:pointer;transition:0.2s;letter-spacing:1px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.back-btn:hover{background:var(--gold-glow);}
.header-title{font-family:'Cinzel Decorative',serif;font-size:22px;color:var(--gold2);letter-spacing:2px;text-shadow:0 0 30px rgba(200,168,75,0.4);}
.header-right{display:flex;align-items:center;gap:12px;}
.clean-btn{background:var(--red-dim);border:1px solid rgba(248,113,113,0.3);color:var(--red);padding:9px 16px;border-radius:8px;font-family:'Cinzel',serif;font-size:12px;cursor:pointer;transition:0.2s;letter-spacing:1px;}
.clean-btn:hover{background:rgba(248,113,113,0.2);}

/* TOOLBAR */
.toolbar{position:relative;z-index:10;display:flex;gap:10px;padding:18px 40px;border-bottom:1px solid var(--border2);flex-wrap:wrap;align-items:center;}
.boss-select,.period-select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:9px 14px;border-radius:8px;font-family:'Crimson Pro',serif;font-size:15px;cursor:pointer;transition:0.2s;}
.boss-select:focus,.period-select:focus{outline:none;border-color:var(--gold);}
.boss-select{min-width:180px;}
.period-tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:8px;}
.period-tab{padding:7px 14px;border:none;border-radius:6px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.5px;cursor:pointer;background:transparent;color:var(--text3);transition:0.2s;}
.period-tab.active{background:var(--surface);color:var(--gold2);border:1px solid var(--border);}
.result-count{margin-left:auto;font-size:14px;color:var(--text3);font-family:'Cinzel',serif;letter-spacing:1px;}

/* MAIN */
.main{position:relative;z-index:10;padding:30px 40px;}

/* TABLE */
.history-table{width:100%;border-collapse:collapse;}
.history-table thead tr{border-bottom:1px solid var(--border);}
.history-table th{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;padding:12px 16px;text-align:left;}
.history-table tbody tr{border-bottom:1px solid var(--border2);transition:0.15s;}
.history-table tbody tr:hover{background:rgba(255,255,255,0.02);}
.history-table td{padding:14px 16px;font-size:15px;color:var(--text2);}
.boss-cell{font-family:'Cinzel',serif;color:var(--gold2);font-size:16px;}
.date-cell{color:var(--text);}
.ago-cell{color:var(--text3);font-size:13px;}
.restore-btn{padding:6px 12px;border-radius:6px;font-family:'Cinzel',serif;font-size:11px;cursor:pointer;transition:0.2s;background:var(--gold-dim);border:1px solid var(--border);color:var(--gold2);}
.restore-btn:hover{background:var(--gold-glow);}
.delete-row-btn{padding:6px 10px;border-radius:6px;font-family:'Cinzel',serif;font-size:11px;cursor:pointer;transition:0.2s;background:var(--red-dim);border:1px solid rgba(248,113,113,0.3);color:var(--red);margin-left:6px;}
.delete-row-btn:hover{background:rgba(248,113,113,0.2);}
.actions-cell{display:flex;gap:6px;align-items:center;}

/* EMPTY / LOADING */
.state-box{text-align:center;padding:80px 20px;color:var(--text3);}
.state-box .icon{font-size:48px;margin-bottom:16px;}
.state-box p{font-size:18px;font-family:'Cinzel',serif;color:var(--text2);margin-bottom:6px;}
.state-box small{font-size:14px;}

/* SWAL */
.swal2-popup{background:var(--surface2)!important;color:var(--text)!important;border:1px solid var(--border)!important;font-family:'Crimson Pro',serif!important;border-radius:16px!important;}
.swal2-title{color:var(--gold2)!important;font-family:'Cinzel',serif!important;}
.swal2-confirm{background:var(--green-dim)!important;border:1px solid rgba(61,220,132,0.3)!important;color:var(--green)!important;font-family:'Cinzel',serif!important;border-radius:8px!important;box-shadow:none!important;}
.swal2-cancel{background:var(--red-dim)!important;border:1px solid rgba(248,113,113,0.3)!important;color:var(--red)!important;font-family:'Cinzel',serif!important;border-radius:8px!important;box-shadow:none!important;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px;}
@media(max-width:700px){
  .header{padding:16px 20px;flex-direction:column;gap:12px;align-items:flex-start;}
  .toolbar{padding:14px 20px;}
  .main{padding:20px;}
  .history-table th:nth-child(3),.history-table td:nth-child(3){display:none;}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <a href="index.html" class="back-btn">← Volver</a>
    <div class="header-title">📜 Historial de Kills</div>
  </div>
  <div class="header-right">
    <button class="clean-btn" onclick="cleanHistory()">🗑 Limpiar historial</button>
  </div>
</header>

<div class="toolbar">
  <select class="boss-select" id="bossFilter" onchange="applyFilters()">
    <option value="all">Todos los bosses</option>
  </select>
  <div class="period-tabs" id="periodTabs">
    <button class="period-tab active" onclick="setPeriod('all',this)">Todo</button>
    <button class="period-tab" onclick="setPeriod('1h',this)">Última hora</button>
    <button class="period-tab" onclick="setPeriod('24h',this)">Últimas 24h</button>
    <button class="period-tab" onclick="setPeriod('7d',this)">Última semana</button>
    <button class="period-tab" onclick="setPeriod('30d',this)">Último mes</button>
  </div>
  <div class="result-count" id="resultCount">—</div>
</div>

<main class="main" id="mainContent">
  <div class="state-box"><div class="icon">⚔</div><p>Cargando historial...</p></div>
</main>

<script>
const SUPA_URL="https://zlwwlshxbvmvotwrffoz.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsd3dsc2h4YnZtdm90d3JmZm96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NTMxNzgsImV4cCI6MjA5NTMyOTE3OH0.3E42PrCq7T61qF8iGcqOd1a9KN1xZ-levUJ21fSFow5Y";
const{createClient}=supabase;
const db=createClient(SUPA_URL,SUPA_KEY);

let allRows=[], bosses=[], currentPeriod="all", currentBoss="all";

function fmtFullDate(d){return new Date(d).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function fmtAgo(d){const ms=Date.now()-new Date(d).getTime(),m=Math.floor(ms/60000),h=Math.floor(m/60),day=Math.floor(h/24);if(day>0)return`hace ${day}d ${h%24}h`;if(h>0)return`hace ${h}h ${m%60}m`;return`hace ${m}m`;}

function periodMs(key){const map={"1h":3600000,"24h":86400000,"7d":604800000,"30d":2592000000};return map[key]||null;}

function setPeriod(key,btn){
  currentPeriod=key;
  document.querySelectorAll(".period-tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}

function applyFilters(){
  let rows=[...allRows];
  if(currentBoss!=="all") rows=rows.filter(r=>r.boss_id===parseInt(currentBoss));
  const limit=periodMs(currentPeriod);
  if(limit) rows=rows.filter(r=>(Date.now()-new Date(r.kill_time).getTime())<=limit);
  renderTable(rows);
}

function renderTable(rows){
  const main=document.getElementById("mainContent");
  document.getElementById("resultCount").textContent=`${rows.length} registro${rows.length!==1?'s':''}`;
  if(!rows.length){
    main.innerHTML=`<div class="state-box"><div class="icon">🗡</div><p>Sin registros</p><small>Probá cambiando el filtro o el período</small></div>`;
    return;
  }
  main.innerHTML=`<table class="history-table">
    <thead><tr>
      <th>Boss</th><th>Fecha y hora</th><th>Hace cuánto</th><th>Acciones</th>
    </tr></thead>
    <tbody>${rows.map(row=>{
      const boss=bosses.find(b=>b.id===row.boss_id);
      return`<tr>
        <td class="boss-cell">${boss?boss.name:'—'}</td>
        <td class="date-cell">${fmtFullDate(row.kill_time)}</td>
        <td class="ago-cell">${fmtAgo(row.kill_time)}</td>
        <td class="actions-cell">
          <button class="restore-btn" onclick="restoreKill(${row.boss_id},'${row.kill_time}')">↩ Restaurar</button>
          <button class="delete-row-btn" onclick="deleteRow(${row.id})">✕</button>
        </td>
      </tr>`;
    }).join("")}</tbody>
  </table>`;
}

async function loadAll(){
  const[bossRes,histRes]=await Promise.all([
    db.from("bosses").select("*").order("name"),
    db.from("kill_history").select("*").order("kill_time",{ascending:false}).limit(500)
  ]);
  bosses=bossRes.data||[];
  allRows=histRes.data||[];

  // Populate boss selector
  const sel=document.getElementById("bossFilter");
  bosses.forEach(b=>{const o=document.createElement("option");o.value=b.id;o.textContent=b.name;sel.appendChild(o);});
  applyFilters();
}

async function restoreKill(bossId,killTime){
  const{isConfirmed}=await Swal.fire({title:"¿Restaurar este timer?",text:`Volver al timer del ${fmtFullDate(killTime)}`,showCancelButton:true,confirmButtonText:"✓ Restaurar",cancelButtonText:"Cancelar"});
  if(!isConfirmed)return;
  await db.from("bosses").update({last_kill:killTime}).eq("id",bossId);
  Swal.fire({icon:"success",title:"Timer restaurado",timer:1500,showConfirmButton:false});
}

async function deleteRow(rowId){
  const{isConfirmed}=await Swal.fire({title:"¿Eliminar este registro?",text:"Se borrará solo esta entrada del historial.",showCancelButton:true,confirmButtonText:"✓ Eliminar",cancelButtonText:"Cancelar"});
  if(!isConfirmed)return;
  await db.from("kill_history").delete().eq("id",rowId);
  allRows=allRows.filter(r=>r.id!==rowId);
  applyFilters();
}

async function cleanHistory(){
  // Armar opciones de qué limpiar
  const bossOptions=bosses.map(b=>`<option value="${b.id}">${b.name}</option>`).join("");
  const{isConfirmed,value}=await Swal.fire({
    title:"🗑 Limpiar historial",
    html:`
      <div style="text-align:left;display:flex;flex-direction:column;gap:12px;margin-top:8px">
        <div>
          <label style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;color:#5a5248;text-transform:uppercase;display:block;margin-bottom:6px">Boss</label>
          <select id="cleanBoss" style="background:#07070d;border:1px solid rgba(200,168,75,0.15);color:#f0ebe0;padding:10px 14px;border-radius:8px;font-size:15px;width:100%">
            <option value="all">Todos los bosses</option>
            ${bossOptions}
          </select>
        </div>
        <div>
          <label style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;color:#5a5248;text-transform:uppercase;display:block;margin-bottom:6px">Período</label>
          <select id="cleanPeriod" style="background:#07070d;border:1px solid rgba(200,168,75,0.15);color:#f0ebe0;padding:10px 14px;border-radius:8px;font-size:15px;width:100%">
            <option value="all">Todo el historial</option>
            <option value="1h">Última hora</option>
            <option value="24h">Últimas 24h</option>
            <option value="7d">Última semana</option>
            <option value="30d">Último mes</option>
          </select>
        </div>
      </div>`,
    showCancelButton:true,
    confirmButtonText:"🗑 Limpiar",
    cancelButtonText:"Cancelar",
    preConfirm:()=>({boss:document.getElementById("cleanBoss").value, period:document.getElementById("cleanPeriod").value})
  });
  if(!isConfirmed)return;

  const{boss,period}=value;
  // Segunda confirmación
  const bossLabel=boss==="all"?"todos los bosses":bosses.find(b=>b.id===parseInt(boss))?.name;
  const periodLabel={"all":"todo el historial","1h":"la última hora","24h":"las últimas 24h","7d":"la última semana","30d":"el último mes"}[period];
  const{isConfirmed:confirmed2}=await Swal.fire({
    title:"⚠ Confirmación final",
    html:`<p style="font-size:16px">Vas a borrar el historial de <b style="color:#e8c96a">${bossLabel}</b> de <b style="color:#e8c96a">${periodLabel}</b>.<br><br>Esta acción no se puede deshacer.</p>`,
    showCancelButton:true,
    confirmButtonText:"Sí, limpiar",
    cancelButtonText:"Cancelar",
    icon:"warning"
  });
  if(!confirmed2)return;

  // Armar query de delete
  let query=db.from("kill_history").delete();
  if(boss!=="all") query=query.eq("boss_id",parseInt(boss));
  if(period!=="all"){
    const since=new Date(Date.now()-periodMs(period)).toISOString();
    query=query.gte("kill_time",since);
  } else {
    // Para borrar todo necesitamos un filtro válido — usamos gt con fecha muy antigua
    if(boss==="all") query=db.from("kill_history").delete().gte("id",0);
  }
  const{error}=await query;
  if(error){Swal.fire({icon:"error",title:"Error",text:error.message,timer:3000,showConfirmButton:false});return;}
  Swal.fire({icon:"success",title:"Historial limpiado",timer:1500,showConfirmButton:false});
  await loadAll();
}

loadAll();
</script>
</body>
</html>
